<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데블스 플랜 <기억의 조각></title>
<style>
  :root {
    /* 학교 망에서 외부 폰트가 막히거나 오프라인일 수 있어 시스템 한글 폰트를 쓴다.
       Gamja Flower가 설치돼 있으면 그것을 먼저 쓴다. */
    --font-body: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --font-display: "Gamja Flower", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --bg-color: #f7f5f0;
    --card-bg: #ffffff;
    --primary: #5c88da;
    --accent: #ff7675;
    --success: #2ecc71;
    --text-main: #2d3436;
    --border-color: #dfe6e9;
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background-color: var(--bg-color);
    color: var(--text-main);
    width: 100vw; height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── 슬라이드 메인 무대 ── */
  .stage {
    position: relative;
    width: 96vw; height: 84vh;
    max-width: 1500px;
    margin: 2vh auto 0 auto;
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    border: 5px solid #e1dbcd;
    overflow: hidden;
  }

  .slide {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s ease;
    display: flex; flex-direction: column;
    padding: 3vh 3vw;
  }
  .slide.active {
    opacity: 1; visibility: visible;
  }

  h2.slide-title {
    font-family: var(--font-display);
    font-size: 2.4rem;
    color: var(--primary);
    margin-bottom: 2vh;
    border-bottom: 3px dashed #ebd9cd;
    padding-bottom: 1vh;
    display: flex; align-items: center; gap: 10px;
  }

  /* 레이아웃 */
  .flex-row { display: flex; gap: 2vw; width: 100%; height: 100%; overflow: hidden; }
  .flex-full { flex: 1; height: 100%; display: flex; flex-direction: column; overflow-y: auto; padding-right: 5px; }

  /* ── 버튼 스타일 ── */
  button {
    font-family: var(--font-display);
    font-size: 1.4rem;
    padding: 10px 24px;
    border: none; border-radius: var(--radius-md);
    cursor: pointer; transition: all 0.15s ease;
    background: var(--primary); color: white;
    box-shadow: 0 4px 0 #4167b2;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #4167b2; }
  button.accent { background: var(--accent); box-shadow: 0 4px 0 #cc5251; }
  button.accent:active { box-shadow: 0 1px 0 #cc5251; }
  button.secondary { background: #10ac84; box-shadow: 0 4px 0 #0d8d6c; }
  button.secondary:active { box-shadow: 0 1px 0 #0d8d6c; }
  button:disabled { background: #dcdde1; color: #a6b1b9; box-shadow: none; cursor: not-allowed; transform: none; }
  
  /* 토글 활성화용 버튼 스타일 */
  button.active-toggle {
    background: #e74c3c !important;
    box-shadow: 0 4px 0 #c0392b !important;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  /* 하단 슬라이드 바 */
  .control-bar {
    display: flex; justify-content: center; align-items: center;
    gap: 3vw; height: 12vh; width: 100%;
  }
  .page-indicator { font-family: var(--font-display); font-size: 1.8rem; font-weight: bold; color: #7f8c8d; }

  /* ── 설정 창 스타일 ── */
  .setup-container { display: flex; flex-direction: column; gap: 2vh; width: 100%; height: 100%; overflow-y: auto; }
  .setup-section { background: #fdfefe; padding: 20px; border-radius: var(--radius-md); border: 2px solid var(--border-color); }
  .setup-section label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 1.1rem; color: #333; }
  .input-item { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--border-color); font-size: 1rem; outline: none; margin-bottom: 15px; }
  .input-item:focus { border-color: var(--primary); }
  
  .file-upload-box {
    border: 3px dashed var(--border-color); padding: 20px; text-align: center; border-radius: 12px;
    background: #f8f9fa; cursor: pointer; transition: background 0.2s;
  }
  .file-upload-box:hover { background: #f1f2f6; border-color: var(--primary); }

  /* ── 이미지 가두기 컨테이너 ── */
  .art-container {
    position: relative; width: 100%; flex: 1;
    background: #f4f4f2; border-radius: var(--radius-md);
    border: 3px solid #ebd9cd; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .art-image { max-width: 100%; max-height: 100%; object-fit: contain; width: auto; height: auto; display: block; }

  /* ── 🔍 돋보기(Magnifier) 레이어 ── */
  .magnifier-glass {
    position: absolute;
    border: 4px solid #fff;
    border-radius: 50%;
    cursor: none; /* 돋보기 창 내부에서 마우스 포인터 숨김 */
    width: 200px;
    height: 200px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    display: none;
    pointer-events: none;
    z-index: 999;
    background-repeat: no-repeat;
  }

  /* ── 배율 조절 바 디자인 ── */
  .zoom-control-panel {
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.9);
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color);
    font-size: 0.9rem; font-weight: bold; color: #333; display: none;
  }
  .zoom-slider { cursor: pointer; accent-color: var(--primary); }

  /* ── 질문/정답 에디터 카드 ── */
  .q-editor-card {
    background: #fdfefe; border: 2px solid var(--border-color);
    padding: 15px; border-radius: 12px; margin-bottom: 12px;
  }
  .q-editor-card p { font-weight: 800; font-size: 1rem; margin-bottom: 6px; color: var(--primary); }
  .q-editor-card input { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid var(--border-color); font-size: 1rem; margin-top: 4px; outline: none; }
  .q-editor-card input:focus { border-color: var(--primary); }

  /* ── 4슬라이드 상단 바 ── */
  .slide4-top-bar {
    display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 1.5vh; gap: 15px;
  }
  .timer-control-panel {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .timer-display-box {
    background: rgba(0,0,0,0.75); color: white; padding: 6px 15px; border-radius: 30px; font-size: 1rem; font-weight: bold;
  }
  .timer-btn-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  }
  .timer-btn {
    font-family: var(--font-body); font-size: 0.85rem; font-weight: bold;
    padding: 4px 10px; background: #ffffff; color: #333333; border: 1px solid #ccd1d9;
    border-radius: 6px; box-shadow: 0 2px 0 #ccd1d9; cursor: pointer; transition: all 0.1s;
  }
  .timer-btn:active { transform: translateY(2px); box-shadow: none; }
  .timer-btn .plus-sign { color: #ff7675; font-weight: 800; }
  .timer-btn .minus-sign { color: #5c88da; font-weight: 800; }

  /* 메시지 센터 */
  .center-msg { text-align: center; margin: auto; max-width: 800px; padding: 20px; }
  .center-msg h1 { font-family: var(--font-display); font-size: 4.2rem; color: var(--accent); margin-bottom: 20px; line-height: 1.2; }
  .center-msg p { font-size: 1.6rem; color: #555; line-height: 1.5; }

  /* 질문 폰트 */
  .quiz-q-box { font-family: var(--font-display); font-size: 3.8rem; text-align: center; margin: auto; line-height: 1.5; color: #2c3e50; padding: 0 20px; }

  /* ── 정답확인 레이아웃 통합 구조 ── */
  .ans-full-view-container { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  
  .ans-bottom-info-bar {
    height: 180px; 
    background: #2c3e50; color: white; padding: 20px 30px; border-radius: 0 0 var(--radius-md) var(--radius-md);
    display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
  }
  .ans-bottom-info-bar h4 { font-family: var(--font-display); font-size: 2.2rem; color: var(--accent); }
  .ans-bottom-info-bar p { font-size: 1.4rem; color: #ecf0f1; font-weight: bold; line-height: 1.4; }
  
  .ans-text-box { 
    background: rgba(46, 204, 113, 0.15); 
    border-left: 5px solid var(--success); 
    padding: 10px 15px; border-radius: 4px; 
    margin-top: 5px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s ease;
  }
  .ans-text-box.show { opacity: 1; visibility: visible; }

  /* ── 🖨️ 인쇄 모드 ── */
  @media print {
    @page { margin: 0; size: auto; }
    html, body {
      width: 100%; height: 100%;
      margin: 0 !important; padding: 0 !important;
      background: #fff !important;
      overflow: hidden !important;
    }
    body * { visibility: hidden; }
    
    #artPrintArea, #artPrintArea * { visibility: visible; }
    #artPrintArea {
      position: absolute; left: 0; top: 0;
      width: 100vw !important; height: 100vh !important;
      background: #fff !important; border: none !important; border-radius: 0 !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      margin: 0 !important; padding: 0 !important;
      page-break-after: avoid !important; break-after: avoid !important;
    }
    #artPrintArea img {
      max-width: 96% !important; max-height: 96% !important;
      width: auto !important; height: auto !important; object-fit: contain !important;
    }
    .slide4-top-bar, .control-bar, button, .ans-bottom-info-bar { display: none !important; }
  }

  /* ── 전체화면 타이머 ── */
  .fullscreen-timer {
    display: none;
    position: absolute;
    top: 3vh;
    right: 3vw;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 1.5vh 2.5vw;
    border-radius: 50px;
    font-size: 3vw;
    font-weight: bold;
    z-index: 9999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #artPrintArea:fullscreen .fullscreen-timer { display: block; }
  #artPrintArea:-webkit-full-screen .fullscreen-timer { display: block; }
  #artPrintArea:-ms-fullscreen .fullscreen-timer { display: block; }
</style>
</head>
<body>

<div class="stage" id="slideStage"></div>

<div class="control-bar">
  <button id="prevBtn" onclick="moveSlide(-1)">◀ 이전 슬라이드</button>
  <div class="page-indicator" id="pageIndicator">1 / 1</div>
  <button id="nextBtn" onclick="moveSlide(1)">다음 슬라이드 ▶</button>
</div>

<script>
  /* ── 기본 상태값 ── */
  let currentIdx = 0;
  let totalSlidesCount = 0;
  let quizCount = 10; 
  let currentImgDataUrl = "https://upload.wikimedia.org/wikipedia/commons/1/1e/Pieter_Bruegel_the_Elder_-_Children%27s_Games_-_Google_Art_Project.jpg";
  let questionsData = [];
  let timerDuration = 600; 
  let timerRemain = 600;
  let timerInterval = null;

  /* ── 🔍 돋보기 상태 제어 변수 ── */
  let isMagnifierActive = false;
  let currentZoomScale = 2; // 초기 기본 돋보기 배율 (2배)

  /* ── 오디오 엔진 ── */
  let audioCtx = null;
  function playTone(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') { 
        osc.type = 'sine'; osc.frequency.setValueAtTime(550, now);
        gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'ding') { 
        const chord = [523.25, 659.25, 783.99]; 
        chord.forEach((freq, i) => {
          const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + i * 0.06);
          g.gain.setValueAtTime(0.08, now + i * 0.06);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
          o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.25);
        });
      }
    } catch(e) { console.log("Audio Error"); }
  }

  window.onload = function() {
    initQuestions();
    renderAllSlides();
  };

  function initQuestions() {
    questionsData = [];
    for (let i = 0; i < quizCount; i++) {
      questionsData.push({ id: i + 1, question: "", answer: "" });
    }
  }

  function updateInputText(idx, field, value) {
    if (field === 'q') questionsData[idx].question = value;
    else if (field === 'a') questionsData[idx].answer = value;
  }

  function handleUrlChange(url) {
    if(url.trim() !== "") {
      currentImgDataUrl = url.trim();
      refreshImages();
    }
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImgDataUrl = e.target.result;
        refreshImages();
        const span = document.querySelector('.file-upload-box span');
        if (span) {
          span.innerHTML = '✅ 파일 업로드 완료 (' + file.name + ') - <span style="font-size:0.9em; font-weight:normal; color:#666;">다른 파일로 변경하려면 클릭하세요</span>';
          span.style.color = '#2ecc71';
        }
      };
      reader.readAsDataURL(file);
    }
  }

  function handleQuizCountChange(val) {
    let num = parseInt(val);
    if (isNaN(num) || num < 1) num = 1;
    if (num > 10) num = 10;
    quizCount = num;
    initQuestions();
    renderAllSlides();
  }

  function handleTimerDurationChange(val) {
    let num = parseInt(val);
    if (isNaN(num)) num = 10;
    if (num < 3) num = 3;
    if (num > 20) num = 20;
    document.getElementById('globalTimerInput').value = num;
    timerDuration = num * 60;
  }

  function refreshImages() {
    document.querySelectorAll('.art-image').forEach(img => {
      img.src = currentImgDataUrl;
    });
  }

  function requestFullscreenImage() {
    playTone('click');
    const container = document.getElementById('artPrintArea');
    if (!container) return;
    if (container.requestFullscreen) container.requestFullscreen();
    else if (container.mozRequestFullScreen) container.mozRequestFullScreen();
    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    else if (container.msRequestFullscreen) container.msRequestFullscreen();
  }

  /* ── 🔍 돋보기 기능 켜기/끄기 토글 토크 ── */
  function toggleMagnifier(btn, slideOffsetIdx) {
    playTone('click');
    isMagnifierActive = !isMagnifierActive;

    const glass = document.getElementById(`magGlass_${slideOffsetIdx}`);
    const sliderPanel = document.getElementById(`zoomPanel_${slideOffsetIdx}`);
    const targetImg = document.getElementById(`ansImg_${slideOffsetIdx}`);

    if (isMagnifierActive) {
      btn.classList.add('active-toggle');
      btn.innerText = "🔍 돋보기 끄기";
      if (sliderPanel) sliderPanel.style.display = "flex";
      if (targetImg) targetImg.style.cursor = "none"; /* 이미지 위에서 + 모양 대신 커서 숨김 */
      initMagnifierLogic(slideOffsetIdx);
    } else {
      btn.classList.remove('active-toggle');
      btn.innerText = "🔍 돋보기 기능";
      if (sliderPanel) sliderPanel.style.display = "none";
      if (glass) glass.style.display = "none";
      if (targetImg) {
        targetImg.style.cursor = "default"; /* 원래 기본 커서로 복구 */
        const clone = targetImg.cloneNode(true);
        targetImg.parentNode.replaceChild(clone, targetImg);
      }
    }
  }

  /* ── 🔍 배율 바 컨트롤러 이벤트 핸들러 ── */
  function handleZoomSliderChange(val, slideOffsetIdx) {
    currentZoomScale = parseFloat(val);
    document.getElementById(`zoomValText_${slideOffsetIdx}`).innerText = currentZoomScale.toFixed(1) + "x";
    
    const glass = document.getElementById(`magGlass_${slideOffsetIdx}`);
    const targetImg = document.getElementById(`ansImg_${slideOffsetIdx}`);
    if (glass && glass.style.display === "block" && targetImg) {
      glass.style.backgroundSize = (targetImg.width * currentZoomScale) + "px " + (targetImg.height * currentZoomScale) + "px";
    }
  }

  /* ── 🔍 정밀 심층 돋보기 마우스 무브 연동 엔진 ── */
  function initMagnifierLogic(slideOffsetIdx) {
    const img = document.getElementById(`ansImg_${slideOffsetIdx}`);
    const glass = document.getElementById(`magGlass_${slideOffsetIdx}`);
    if (!img || !glass) return;

    glass.style.backgroundImage = "url('" + img.src + "')";

    img.addEventListener('mousemove', moveMagnifier);
    glass.addEventListener('mousemove', moveMagnifier);
    img.addEventListener('mouseleave', hideGlass);

    function hideGlass() {
      glass.style.display = "none";
    }

    function moveMagnifier(e) {
      if (!isMagnifierActive) return;
      glass.style.display = "block";

      glass.style.backgroundSize = (img.width * currentZoomScale) + "px " + (img.height * currentZoomScale) + "px";

      const rect = img.getBoundingClientRect();
      const container = img.parentElement;
      const containerRect = container.getBoundingClientRect();

      let x = e.clientX - rect.left;
      let y = e.clientY - rect.top;

      let glassX = e.clientX - containerRect.left - (glass.offsetWidth / 2);
      let glassY = e.clientY - containerRect.top - (glass.offsetHeight / 2);

      glass.style.left = glassX + "px";
      glass.style.top = glassY + "px";

      let rx = (x * currentZoomScale) - (glass.offsetWidth / 2);
      let ry = (y * currentZoomScale) - (glass.offsetHeight / 2);

      glass.style.backgroundPosition = "-" + rx + "px -" + ry + "px";
    }
  }

  /* ── 동적 슬라이드 생성기 ── */
  function renderAllSlides() {
    const stage = document.getElementById('slideStage');
    stage.innerHTML = "";

    // [슬라이드 1] 
    const s1 = document.createElement('div');
    s1.className = "slide active";
    s1.id = "slide_0";
    s1.innerHTML = `
      <h2 class="slide-title">⚙️ [1단계] 감상할 작품 이미지 로드 및 기본 설정</h2>
      <div class="setup-container">
        <div class="setup-section">
          <label>① 외부 이미지 주소(URL) 입력 연결</label>
          <input type="text" class="input-item" placeholder="구글 등에서 복사한 이미지 주소를 여기에 붙여넣으세요." oninput="handleUrlChange(this.value)">
          
          <label style="margin-top:5px;">② 또는 내 컴퓨터의 로컬 이미지 파일 업로드</label>
          <div class="file-upload-box" onclick="document.getElementById('fileInputElement').click()">
            <span style="font-weight:bold; color:var(--primary);">📂 내 컴퓨터에서 이미지 파일 선택하기</span>
            <input type="file" id="fileInputElement" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
          </div>
        </div>

        <div class="setup-section">
          <label>③ 질문 개수 세팅 (1개 ~ 최대 10개까지 자유 지정)</label>
          <input type="number" class="input-item" min="1" max="10" value="${quizCount}" onchange="handleQuizCountChange(this.value)">
          
          <label>④ 관찰 타이머 설정 (분 단위, 최소 3분 ~ 최대 20분)</label>
          <input type="number" class="input-item" id="globalTimerInput" min="3" max="20" value="${timerDuration / 60}" onchange="handleTimerDurationChange(this.value)">
        </div>

        <div class="setup-section" id="setSection">
          <label>⑤ 문제 세트 — 한 번 만든 문제를 저장해 두고 다시 불러옵니다</label>
          <div id="setListRow" style="display:none;">
            <select class="input-item" id="setSelect" onchange="loadSetFromList(this.value)">
              <option value="">저장된 세트 고르기…</option>
            </select>
          </div>
          <div class="file-upload-box" onclick="document.getElementById('setFileInput').click()">
            <span style="font-weight:bold; color:var(--primary);">📁 세트 파일(.json) 불러오기</span>
            <input type="file" id="setFileInput" accept="application/json,.json" style="display:none;" onchange="importSetFile(event)">
          </div>
          <button class="input-item" style="cursor:pointer;" onclick="exportSet()">💾 지금 설정을 세트 파일로 저장</button>
          <p id="setMsg" style="font-size:0.8rem; color:#7f8c8d; margin-top:4px;"></p>
        </div>
      </div>
    `;
    stage.appendChild(s1);

    // [슬라이드 2] 질문/정답 입력창
    const s2 = document.createElement('div');
    s2.className = "slide";
    s2.id = "slide_1";
    
    let textInputsHtml = "";
    questionsData.forEach((q, idx) => {
      textInputsHtml += `
        <div class="q-editor-card">
          <p>📝 미션 질문 및 정답 세트 [ ${q.id} ]</p>
          <input type="text" value="${q.question}" placeholder="질문 문항을 작성하세요." oninput="updateInputText(${idx}, 'q', this.value)">
          <input type="text" value="${q.answer}" placeholder="정답 내용을 적어주세요." style="border-color:var(--success); margin-top:8px;" oninput="updateInputText(${idx}, 'a', this.value)">
        </div>
      `;
    });

    s2.innerHTML = `
      <h2 class="slide-title">🛠️ [2단계] 관찰 질문 및 정답 텍스트 구성창</h2>
      <div class="flex-row">
        <div class="flex-full">${textInputsHtml}</div>
      </div>
    `;
    stage.appendChild(s2);

    // [슬라이드 3] 준비 완료 브릿지
    const s3 = document.createElement('div');
    s3.className = "slide";
    s3.id = "slide_2";
    s3.innerHTML = `
      <div class="center-msg">
        <h1>준비완료! 🚀</h1>
        <p style="margin-top:25px; font-weight:bold; color:#7f8c8d;">질문과 정답 구성이 모두 끝났습니다.</p>
        <p style="color:var(--primary); font-weight:800; margin-top:15px; font-size:1.8rem;">다음 버튼을 누르면 이미지 집중 관찰이 시작됩니다.</p>
      </div>
    `;
    stage.appendChild(s3);

    // [슬라이드 4] 명화 관찰 슬라이드
    const s4 = document.createElement('div');
    s4.className = "slide";
    s4.id = "slide_3";
    s4.innerHTML = `
      <div class="slide4-top-bar">
        <div style="display:flex; gap:10px;">
          <button class="secondary" onclick="requestFullscreenImage()">🖥️ 칠판 가득 전체화면 보기</button>
          <button class="accent" onclick="window.print()">🖨️ 감상지 인쇄하기 (A4 1장)</button>
        </div>
        <div class="timer-control-panel">
          <div class="timer-display-box" id="slide4TimerText">⏳ 제한시간: 10:00</div>
          <div class="timer-btn-grid">
            <button class="timer-btn" onclick="changeTimerTime(60)"><span class="plus-sign">+</span> 1분</button>
            <button class="timer-btn" onclick="changeTimerTime(300)"><span class="plus-sign">+</span> 5분</button>
            <button class="timer-btn" onclick="changeTimerTime(600)"><span class="plus-sign">+</span> 10분</button>
            <button class="timer-btn" onclick="changeTimerTime(-60)"><span class="minus-sign">-</span> 1분</button>
            <button class="timer-btn" onclick="changeTimerTime(-300)"><span class="minus-sign">-</span> 5분</button>
            <button class="timer-btn" onclick="changeTimerTime(-600)"><span class="minus-sign">-</span> 10분</button>
          </div>
        </div>
      </div>
      <div class="art-container" id="artPrintArea">
        <div id="fullscreenTimer" class="fullscreen-timer">⏳ 제한시간: 10:00</div>
        <img src="${currentImgDataUrl}" class="art-image">
      </div>
    `;
    stage.appendChild(s4);

    // [슬라이드 5] 관찰 종료 브릿지
    const s5 = document.createElement('div');
    s5.className = "slide";
    s5.id = "slide_4";
    s5.innerHTML = `
      <div class="center-msg">
        <h1 style="font-size:4.8rem; color:var(--primary);">관찰은 끝났습니다! 👀</h1>
        <h1 style="font-size:3.5rem; color:var(--accent); margin-top:15px;">곧 질문이 시작됩니다. 준비하세요!</h1>
        <p style="margin-top:30px;">화면에 등장하는 질문을 잘 보고 머릿속으로 정답을 떠올려보세요.</p>
      </div>
    `;
    stage.appendChild(s5);

    // [슬라이드 6 ~ ] 개별 질문 카드 슬라이드
    questionsData.forEach((q, idx) => {
      const sq = document.createElement('div');
      sq.className = "slide";
      sq.id = `slide_${5 + idx}`;
      sq.innerHTML = `
        <h2 class="slide-title">📝 기억의 조각 질문 [ ${q.id} / ${quizCount} ]</h2>
        <div class="quiz-q-box" id="dynamicQText_${idx}">"${q.question}"</div>
      `;
      stage.appendChild(sq);
    });

    // 정답 확인 진입 브릿지
    const sAnsIntro = document.createElement('div');
    sAnsIntro.className = "slide";
    sAnsIntro.id = `slide_${5 + quizCount}`;
    sAnsIntro.innerHTML = `
      <div class="center-msg">
        <h1>정답을 확인하겠습니다! 🎉</h1>
        <p style="margin-top:20px;">여러분이 찾은 내용과 실제 정답이 일치하는지 큰 화면으로 대조해봅시다.</p>
      </div>
    `;
    stage.appendChild(sAnsIntro);

    // [정답 슬라이드]
    questionsData.forEach((q, idx) => {
      const sa = document.createElement('div');
      sa.className = "slide";
      sa.id = `slide_${6 + quizCount + idx}`;
      sa.innerHTML = `
        <div class="ans-full-view-container">
          <div class="art-container" style="border-radius:var(--radius-md) var(--radius-md) 0 0; border-bottom:none;">
            <div id="magGlass_${idx}" class="magnifier-glass"></div>
            <img src="${currentImgDataUrl}" class="art-image" id="ansImg_${idx}">
          </div>
          <div class="ans-bottom-info-bar">
            <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
              <h4 id="dynamicAnsTitle_${idx}">🎯 질문 ${q.id} 정답 확인</h4>
              
              <div style="display:flex; gap:12px; align-items:center;">
                <div class="zoom-control-panel" id="zoomPanel_${idx}">
                  <span>🔎 배율조정:</span>
                  <input type="range" class="zoom-slider" min="1.5" max="4.5" step="0.5" value="${currentZoomScale}" oninput="handleZoomSliderChange(this.value, ${idx})">
                  <span id="zoomValText_${idx}">${currentZoomScale.toFixed(1)}x</span>
                </div>
                <button class="secondary" style="font-size:1.1rem; padding:6px 20px;" onclick="toggleMagnifier(this, ${idx})">🔍 돋보기 기능</button>
                <button class="accent" style="font-size:1.1rem; padding:6px 20px;" onclick="revealAnswerText(${idx})">정답 확인하기</button>
              </div>
              
            </div>
            <p style="color:#f1f2f6;" id="dynamicAnsQ_${idx}">Q. ${q.question}</p>
            <div class="ans-text-box" id="ansTextWrapper_${idx}">
              <p style="color:#2ecc71; font-weight:800; font-size:1.4rem;" id="dynamicAnsA_${idx}">💡 정답: ${q.answer}</p>
            </div>
          </div>
        </div>
      `;
      stage.appendChild(sa);
    });

    // 에필로그 슬라이드
    const sEnd = document.createElement('div');
    sEnd.className = "slide";
    sEnd.id = `slide_${6 + quizCount * 2}`;
    sEnd.innerHTML = `
      <div class="center-msg">
        <h1>🎨 데블스 플랜 &lt;기억의 조각&gt; 활동이 모두 끝났습니다!</h1>
        <p style="margin-top:20px; font-size:1.4rem;">훌륭하게 미션을 수행한 여러분 최고입니다!</p>
        <div style="margin-top:6vh; display:flex; gap:20px; justify-content:center;">
          <button style="font-size:1.5rem;" onclick="location.reload()">🔄 초기화 (새이미지로)</button>
          <button class="accent" style="font-size:1.5rem;" onclick="jumpToQuizRestart()">🔁 다시 풀어보기</button>
        </div>
      </div>
    `;
    stage.appendChild(sEnd);

    totalSlidesCount = 7 + quizCount * 2;
    updateNavigation();
    initSetList();
  }


  /* ── 문제 세트 저장·불러오기 ────────────────────────────────────
     같은 문제를 매번 다시 입력하지 않도록 JSON으로 주고받는다.
     세트 형식: { title, image, timerMinutes, questions: [{question, answer}] } */

  function setMsg(text) {
    const el = document.getElementById('setMsg');
    if (el) el.textContent = text || "";
  }

  /* sets/index.json이 있으면 목록을 채운다. file://로 열면 fetch가 막히므로
     실패해도 조용히 넘어가고 파일 불러오기만 남긴다. */
  function initSetList() {
    fetch('sets/index.json')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(list => {
        if (!Array.isArray(list) || list.length === 0) return;
        const sel = document.getElementById('setSelect');
        const row = document.getElementById('setListRow');
        if (!sel || !row) return;
        list.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.file;
          opt.textContent = item.title || item.file;
          sel.appendChild(opt);
        });
        row.style.display = "";
      })
      .catch(() => {});
  }

  function loadSetFromList(file) {
    if (!file) return;
    fetch('sets/' + file)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(applySet)
      .catch(() => setMsg("세트를 불러오지 못했습니다."));
  }

  function importSetFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        applySet(JSON.parse(e.target.result));
      } catch (err) {
        setMsg("JSON 형식이 아닙니다.");
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  function applySet(data) {
    if (!data || !Array.isArray(data.questions)) {
      setMsg("questions 항목이 없는 파일입니다.");
      return;
    }
    const qs = data.questions.slice(0, 10);
    if (qs.length === 0) { setMsg("문항이 비어 있습니다."); return; }

    quizCount = qs.length;
    questionsData = qs.map((q, i) => ({
      id: i + 1,
      question: q.question || "",
      answer: q.answer || ""
    }));
    if (typeof data.image === 'string' && data.image.trim() !== "") {
      currentImgDataUrl = data.image.trim();
    }
    const mins = parseInt(data.timerMinutes);
    if (!isNaN(mins) && mins >= 3 && mins <= 20) {
      timerDuration = mins * 60;
      timerRemain = timerDuration;
    }
    renderAllSlides();
    setMsg((data.title ? '「' + data.title + '」 ' : "") + "세트를 불러왔습니다. 문항 " + quizCount + "개.");
  }

  function exportSet() {
    const data = {
      title: "기억의 조각 문제 세트",
      image: currentImgDataUrl,
      timerMinutes: Math.round(timerDuration / 60),
      questions: questionsData.map(q => ({ question: q.question, answer: q.answer }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'memory-set.json';
    a.click();
    URL.revokeObjectURL(a.href);
    setMsg("세트 파일을 내려받았습니다.");
  }

  function changeTimerTime(seconds) {
    playTone('click');
    timerRemain += seconds;
    if (timerRemain < 0) timerRemain = 0;
    updateTimerDisplay();
  }

  function updateTimerDisplay() {
    const display = document.getElementById('slide4TimerText');
    const fsDisplay = document.getElementById('fullscreenTimer');
    if(!display) return;

    let min = Math.floor(timerRemain / 60);
    let sec = timerRemain % 60;
    let timeStr = `⏳ 제한시간: ${min < 10 ? '0' + min : min}:${sec < 10 ? '0' + sec : sec}`;
    display.innerText = timeStr;
    if (fsDisplay) fsDisplay.innerText = timeStr;
  }

  function startLiveTimer(seconds) {
    timerRemain = seconds;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      timerRemain--;
      if (timerRemain < 0) {
        timerRemain = 0;
        clearInterval(timerInterval);
        moveSlide(1); 
        return;
      }
      updateTimerDisplay();
    }, 1000);
  }

  function revealAnswerText(idx) {
    playTone('ding');
    const box = document.getElementById(`ansTextWrapper_${idx}`);
    if(box) box.classList.add('show');
  }

  function syncDataToSlides() {
    questionsData.forEach((q, idx) => {
      const qBox = document.getElementById(`dynamicQText_${idx}`);
      if (qBox) qBox.innerText = `"${q.question}"`;

      const ansQ = document.getElementById(`dynamicAnsQ_${idx}`);
      const ansA = document.getElementById(`dynamicAnsA_${idx}`);
      if (ansQ) ansQ.innerText = `Q. ${q.question}`;
      if (ansA) ansA.innerHTML = `💡 정답: ${q.answer}`;
    });
  }

  function updateNavigation() {
    isMagnifierActive = false;
    syncDataToSlides();

    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const currentSlideDOM = document.getElementById(`slide_${currentIdx}`);
    if (currentSlideDOM) currentSlideDOM.classList.add('active');

    document.getElementById('pageIndicator').innerText = `${currentIdx + 1} / ${totalSlidesCount}`;
    document.getElementById('prevBtn').disabled = (currentIdx === 0);
    document.getElementById('nextBtn').disabled = (currentIdx === totalSlidesCount - 1);

    clearInterval(timerInterval);
    
    if (currentIdx === 3) {
      startLiveTimer(timerDuration);
    }
  }

  function moveSlide(dir) {
    playTone('click');
    currentIdx += dir;
    if (currentIdx < 0) currentIdx = 0;
    if (currentIdx >= totalSlidesCount) currentIdx = totalSlidesCount - 1;
    updateNavigation();
  }

  function jumpToQuizRestart() {
    currentIdx = 3;
    document.querySelectorAll('.ans-text-box').forEach(box => box.classList.remove('show'));
    updateNavigation();
  }
</script>

</body>
</html>
