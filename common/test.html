<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>공용 로직 자체 검증 — 순위 판정</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="../styles.css" />
<style>
  #summary { font-size: 18px; font-weight: 700; padding: 12px 16px; border-radius: 12px; border: 1px solid currentColor; }
  #summary.pass { color: var(--ready); background: var(--ready-bg); }
  #summary.fail { color: #dc2626; background: #fef2f2; }
  @media (prefers-color-scheme: dark) { #summary.fail { color: #f87171; background: #3a1414; } }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  li:last-child { border-bottom: none; }
  li .mark { font-weight: 700; margin-right: 8px; }
  li.ok .mark { color: var(--ready); }
  li.no { color: #dc2626; }
  @media (prefers-color-scheme: dark) { li.no { color: #f87171; } }
  li pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>공용 로직 자체 검증</h1>
    <p><code>common/js/rank.js</code> — 점수 → 등수 (동점 처리 포함)</p>
  </header>
  <div id="summary">돌리는 중…</div>
  <ul id="list"></ul>
  <footer><p><a href="../">← 게임 목록으로</a></p></footer>
</div>

<script type="module">
import { runAll } from './js/tests.js';

const results = runAll();
const failed = results.filter((r) => !r.ok);
const summary = document.getElementById('summary');
summary.className = failed.length === 0 ? 'pass' : 'fail';
summary.textContent = failed.length === 0
  ? `통과 ${results.length} / 실패 0`
  : `통과 ${results.length - failed.length} / 실패 ${failed.length}`;

const list = document.getElementById('list');
for (const r of results) {
  const li = document.createElement('li');
  li.className = r.ok ? 'ok' : 'no';
  const mark = document.createElement('span');
  mark.className = 'mark';
  mark.textContent = r.ok ? 'PASS' : 'FAIL';
  li.append(mark);
  const [first, ...rest] = r.label.split('\n');
  li.append(document.createTextNode(first));
  if (rest.length) {
    const pre = document.createElement('pre');
    pre.textContent = rest.join('\n');
    li.append(pre);
  }
  list.append(li);
}
</script>
</body>
</html>
